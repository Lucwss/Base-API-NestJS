services:
  postgres:
    image: postgres:16-alpine
    container_name: nestjs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ROOT
      POSTGRES_PASSWORD: ROOT
      POSTGRES_DB: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ROOT -d root"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: